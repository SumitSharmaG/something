<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Anvika Ji 🌼</title>
    <!-- Google Fonts for cute typography -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Floating background elements */
        .bg-element {
            position: absolute;
            font-size: 1.5rem;
            animation: float 6s infinite ease-in-out;
            opacity: 0.6;
        }

        .bg-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .bg-2 { top: 20%; right: 15%; animation-delay: 1.5s; }
        .bg-3 { bottom: 15%; left: 15%; animation-delay: 3s; }
        .bg-4 { bottom: 10%; right: 10%; animation-delay: 4.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        /* Cute Card Design */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 25px;
            padding: 40px 25px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(238, 156, 167, 0.4);
            position: relative;
            z-index: 10;
            animation: popIn 0.8s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .please-msg {
            font-size: 1.1rem;
            color: #e91e63;
            font-weight: 600;
            margin-top: 20px;
            display: inline-block;
            background: #ffe4e8;
            padding: 8px 22px;
            border-radius: 20px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
        }

        /* Decorative Sparkle Icon */
        .top-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* Main Message Styling */
        .message {
            font-size: 1.8rem;
            font-weight: 600;
            color: #d81b60;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* Signature Styling */
        .signature {
            font-family: 'Caveat', cursive;
            font-size: 2.3rem;
            color: #8e24aa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .flower {
            display: inline-block;
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Popup Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .modal-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 25px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 15px 35px rgba(238, 156, 167, 0.4);
            border: 2px solid #ffffff;
            animation: popIn 0.5s ease-out;
        }

        .modal-card h2 {
            color: #d81b60;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .modal-card p {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .modal-card input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #ffdde1;
            border-radius: 15px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.95rem;
            background: #fffafa;
        }

        .modal-card input:focus {
            border-color: #ee9ca7;
        }

        .modal-card button {
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            color: #d81b60;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(238, 156, 167, 0.3);
            transition: transform 0.2s;
        }

        .modal-card button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Background Audio Element -->
    <audio id="bgAudio" src="audio1.mp3" loop></audio>

    <!-- Entry Pop-up Modal -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-card">
            <h2>Welcome! 💖</h2>
            <p>Apna Name To Batao 🙂</p>
            <input type="text" id="nameInput" placeholder="Your Name🌷Cutey...?">
            <br>
            <button id="enterBtn">Enter ✨</button>
        </div>
    </div>

    <!-- Cute Floating BG Icons -->
    <div class="bg-element bg-1">✨</div>
    <div class="bg-element bg-2">💖</div>
    <div class="bg-element bg-3">🌸</div>
    <div class="bg-element bg-4">✨</div>

    <!-- Main Card -->
    <div class="card">
        <div class="top-icon">💌</div>
        <div class="message">Ab Bata Bhi Do...</div>
        <div class="signature">
            ~Anvika ji <span class="flower">🌼</span>
        </div>
        <div>
            <div class="please-msg">Please 🙂</div>
        </div>
    </div>

    <!-- JavaScript to handle modal click & audio trigger -->
    <script>
        const enterBtn = document.getElementById('enterBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const bgAudio = document.getElementById('bgAudio');

        enterBtn.addEventListener('click', () => {
            // Play the background audio
            bgAudio.play().catch(error => {
                console.log("Audio autoplay restricted or missing file:", error);
            });

            // Smoothly hide the modal
            modalOverlay.style.opacity = '0';
            setTimeout(() => {
                modalOverlay.style.display = 'none';
            }, 500);
        });
    </script>

</body>
            </html>
